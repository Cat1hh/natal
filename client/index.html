<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VULPORA · Universos Interativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/global.css" />
  <script>
    (function () {
      function checkNatalRedirect() {
        var h = window.location.hash || "";
        var mComm = h.match(/^#\/comunidade\/([^/]+)\/natal/i);
        if (mComm) {
          window.location.replace("/comunidade/" + mComm[1].toLowerCase() + "/natal#inicio");
          return;
        }
        if (/^#\/evento\/natal-2026-heaven/i.test(h)) {
          window.location.replace("/comunidade/heaven/natal#inicio");
          return;
        }
        if (/^#\/evento\/natal-2026/i.test(h)) {
          window.location.replace("/comunidade/thekingdom/natal#inicio");
        }
      }
      checkNatalRedirect();
      window.addEventListener("hashchange", checkNatalRedirect);
    })();
  </script>
  <script>
  if (location.pathname !== '/' && !location.pathname.startsWith('/api') && !location.pathname.startsWith('/auth')) {
    const clean = location.pathname.replace(/^\/comunidade\/([^/]+)\/?$/, '/comunidade/$1/inicio');
    location.replace('/#' + clean + location.search);
  }
</script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>

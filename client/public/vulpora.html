<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VULPORA · Universos Interativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/global.css" />
  <script>
    (function () {
      function communitySlug(value) {
        var slug = value.toLowerCase();
        if (['ducks', 'heavem', 'heaven'].includes(slug)) return 'heaven';
        if (['kingdom', 'the-kingdom', 'thekingdom'].includes(slug)) return 'thekingdom';
        return slug;
      }
      function routeEntry() {
        var hash = window.location.hash || '';
        var event = hash.match(/^#\/comunidade\/([^/]+)\/natal(?:\/([^/?#]+))?(?:\?([^#]*))?$/i);
        var oldEvent = hash.match(/^#\/evento\/(natal-2026(?:-heaven)?)(?:\/([^/?#]+))?(?:\?([^#]*))?$/i);
        if (event || oldEvent) {
          var slug = event ? communitySlug(event[1]) : (/heaven$/i.test(oldEvent[1]) ? 'heaven' : 'thekingdom');
          var tab = event ? event[2] : oldEvent[2];
          var query = event ? event[3] : oldEvent[3];
          window.location.replace('/comunidade/' + slug + '/natal' + (query ? '?' + query : location.search) + '#' + (tab || 'inicio'));
          return;
        }
        var path = window.location.pathname;
        if (path !== '/' && !/^\/(api|auth)(\/|$)/.test(path)) {
          var target = path
            .replace(/^\/(?:portal\/)?comunidades?\/?$/i, '/portal/comunidades')
            .replace(/^\/comunidade\/([^/]+)(?:\/(.*))?$/i, function (_, slug, rest) {
              return '/comunidade/' + communitySlug(slug) + '/' + (rest || 'inicio');
            });
          window.location.replace('/#' + target + window.location.search);
        }
      }
      routeEntry();
      window.addEventListener('hashchange', routeEntry);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
